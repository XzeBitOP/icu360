name: Weekly view counts

on:
  schedule:
    - cron: "0 19 * * 0" # Sunday 19:00 UTC = Monday 00:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-views
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write rounded counts to content/views.json
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node scripts/update-views.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- content/views.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "icu360-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/views.json
          git commit -m "chore(views): weekly view counts"
          git push
